
version: '3'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  validate:
    desc: Validate catalog membership, skill resources, and the Agent Skills specification
    cmds:
      - python3 -B .scripts/skills.py validate
      - task: validate:spec

  validate:spec:
    desc: Validate YAML and run the pinned Agent Skills checks and tests
    cmds:
      - bash .scripts/check.sh spec

  test:
    desc: Run all offline tests
    cmds:
      - python3 -B -m unittest discover -s tests -v

  eval:check:
    desc: Validate evaluation scenarios and fixtures
    cmds:
      - python3 -B -m unittest discover -s tests -p 'test_evaluations.py' -v

  quality:
    desc: Run static analysis and security checks
    cmds:
      - task: syntax:check
      - bash .scripts/check.sh quality

  syntax:check:
    desc: Check wrapper and fixture shell syntax
    cmds:
      - bash .scripts/check.sh syntax

  docs:check:
    desc: Check generated README catalog, local Markdown links, and anchors
    cmds:
      - bash .scripts/check.sh docs

  docs:generate:
    desc: Regenerate the README skill catalog from catalog.json and skill metadata
    cmds:
      - uv run --project .scripts/spec --locked --no-python-downloads python .scripts/generate_readme.py

  ci:
    desc: Run all required quality gates
    cmds:
      - task: validate
      - task: test
      - task: quality
      - task: docs:check
