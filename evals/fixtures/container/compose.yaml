services:
  database:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local-fixture-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 1s
      retries: 10
  api:
    image: example.invalid/fixture-api:dev
    environment:
      DATABASE_HOST: database
    depends_on:
      - database
    ports:
      - "127.0.0.1:8000:8000"
