name: Validate skills

on: [ push, pull_request ]

permissions: { }

defaults:
  run:
    shell: bash

jobs:
  validate:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate catalog
        run: python3 -B .scripts/skills.py validate
      - name: Run offline tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Check shell wrapper syntax
        run: bash .scripts/check.sh syntax

  static-checks:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          require-checksums: true
          enable-cache: false

      - name: Validate the Agent Skills specification and repository YAML
        run: bash .scripts/check.sh spec

      - name: Install checksum-verified analyzers
        working-directory: ${{ runner.temp }}
        run: |
          mkdir quality-bin
          fetch_tool() {
            local name="$1" url="$2" digest="$3"
            curl --fail --silent --show-error --location --retry 2 --max-time 30 \
              --output "$name.tar.gz" "$url"
            printf '%s  %s\n' "$digest" "$name.tar.gz" | sha256sum --check --strict
            mkdir "$name"
            tar -xzf "$name.tar.gz" -C "$name"
            find "$name" -type f -name "$name" -exec install -m 0755 {} "quality-bin/$name" \;
            test -x "quality-bin/$name"
          }
          fetch_tool actionlint \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          fetch_tool zizmor \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
          fetch_tool lychee \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      - name: Check shell wrappers and GitHub Actions
        run: PATH="$RUNNER_TEMP/quality-bin:$PATH" bash .scripts/check.sh quality

      - name: Check local Markdown links and anchors
        run: PATH="$RUNNER_TEMP/quality-bin:$PATH" bash .scripts/check.sh docs
